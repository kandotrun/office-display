[package]
name = "photo-frame-rs"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Bounded native X11 photo-frame prototype; loopback RAM-only inputs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
